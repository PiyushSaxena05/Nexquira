spring.application.name=SR

gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=
gemini.api.key=${GEMINI_KEY}

spring.datasource.url=jdbc:h2:file:./data/nexquira;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

jwt.secret=${JWT_SECRET:change-this-to-a-long-random-string-in-prod-please}
jwt.expiration-ms=86400000
